name: Build Docs

# Build the mdBook site and publish the generated HTML to the gh-pages branch.
# GitHub Pages must be configured once with:
#   Settings > Pages > Build and deployment > Deploy from a branch
#   branch: gh-pages, folder: / (root)
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  build:
    name: build and publish docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/mdbook.tar.gz
          tar -xzf /tmp/mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mdbook" --version

      - name: Build site
        run: mdbook build

      # The generated `book/` directory is the whole site. `enable_jekyll: false`
      # adds a .nojekyll file so GitHub Pages serves the HTML as-is.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          publish_branch: gh-pages
          enable_jekyll: false
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: publish ${{ github.sha }}"
